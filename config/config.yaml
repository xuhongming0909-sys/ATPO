  permissions: [cb]
  strategy: all
# 账户按客户端动态匹配；未配置/未确认的账户不执行
- id: 吴志聪PA
  display_name: 平安证券-吴*聪
  broker: 平安证券
  account_type: normal
  enabled: true
  permissions: [cb]
  strategy: all
- id: 许鸿鸣HB
  broker: 华宝证券
  account_type: normal
  enabled: false
  permissions: [cb, cyb]
  strategy: all
# THS2 已发现但尚未录入资金账号/权限确认；先停用，补齐 secrets 后再启用
- id: 刘*伟
  display_name: 平安证券-刘*伟
  broker: 平安证券
  account_type: normal
  enabled: false
  permissions: [cb]
  strategy: all
- id: 余*彬
  display_name: 平安证券-余*彬
  broker: 平安证券
  account_type: normal
  enabled: false
  permissions: [cb]
  strategy: all
strategy:
  new_stock: all           # 新股全部申购（用户已确认）
  convertible_bond: all    # 可转债全部申购
  blacklist: []            # 预留：按代码排除标的

schedule:
  calendar_fetch: "08:30"  # 拉取当日打新日历
  subscribe_time: "10:00"  # 触发申购（T 日，用户拍板 10:00）
  subscribe_window: ["09:30", "15:00"]  # live 允许提交的当日时段
  allotment_check_1: "22:00"  # T+1 晚查中签
  allotment_check_2: "08:00"  # T+2 早补查

notification:
  channels: [serverchan]   # Server酱 SendKey 在 secrets.yaml
  email_fallback: false    # 中签等关键消息的兜底通道，M4 再开
  skip_push_when_empty: true  # 当日无可申购标的（含节假日）时不推送

execution:
  mode: live               # dry_run | live；实盘必须显式改 live 并经用户确认（2026-10-15 用户拍板切 live）
  ths_account_switch:

    hexin_path: 'E:\同花顺\同花顺\hexin.exe'
    xiadan_path: 'E:\同花顺\同花顺\xiadan.exe'
    max_ths_accounts: 10
    max_fund_accounts_per_ths: 10
    accounts:
      - username: mx_525378109
        enabled: true
      - username: mx_mbqdpecj9
        enabled: true
# GUI 参数集中区：登录链路代码不散落长期硬编码坐标、阈值、等待时长
gui:
  ths_account_switch:
    dialog_wait_s: 2
    switch_account_control_id: 20199
    cancel_control_id: 20149
    exit_control_id: 21042
    username_ocr_x_ratio: 0.65
    username_ocr_top_px: 36
    username_ocr_min_score: 0.78
    username_ocr_min_margin: 0.12
    restart_timeout_s: 60
    login_wait_s: 60
    login_click_verify_wait_s: 0.5
    saved_password_checkbox_text: 保存密码
    per_fund_timeout_s: 25   # 单资金户登录硬限时（秒）：健康登录11-26s，25s以下判失败防误杀
    fund_total_timeout_s: 45 # 单资金户整体硬限时（秒）：登录+申购+核验全部做完的上限
    fund_login_result_wait_s: 15
    fund_login_poll_interval_s: 0.5
    post_dialog_result_wait_s: 5
    post_dialog_poll_interval_s: 0.5
    dropdown_attempts: 3
    screenshot_on_failure: true
  xiadan:
    fund_account_control_id: 1711
    account_combo_control_id: 2322
  hexin_login:
    button_template: runtime_data/tpl_account_btn.png
    button_threshold: 0.8
    button_band_height: 30
    button_click_dx: 8
    button_click_dy: 10
    button_attempts: 3
    menu_wait_s: 5
    allow_coordinate_fallback: true   # 文本不可读时按实测菜单行点击；每行必须做账户身份复核
    row_height: 26
    row_first_offset: 19
    row_x_offset: 116
    login_wait_s: 15
    post_click_wait_s: 1.5
    dropdown_attempts: 5
    dropdown_wait_s: 2
    menu_read_attempts: 3
    menu_read_retry_wait_s: 0.2
    max_accounts: 10
    close_login_dialog: true
    login_dialog_title: 委托下单
    login_dialog_keywords: [资金账号, 资金帐号, 交易密码, 验证码]
    dialog_close_wait_s: 0.5

  lifecycle:
    close_after_task: true
    close_preexisting: true    # 任务结束温和关闭已占用客户端；关闭失败必须报告，不强杀
    close_timeout_s: 15

# 开机自动登录（AutoIPO-BootLogin 计划任务，登录触发+脚本内等网络就绪）
boot_login:
  max_accounts: 10         # 由当前客户端菜单动态选择，单实例容量约 10；不按券商/账户硬编码
  probe_url: "http://www.baidu.com"  # 网络探活地址：收到 HTTP 应答（含4xx/5xx）即算联网
  network_timeout_s: 600   # 等网络就绪上限，超时放弃本次（后续订阅/查签任务会再拉起客户端）

catchup:
  enabled: true
  subscribe_skip_after: "15:00"
  allotment_retry_interval_min: 30
  allotment_keep_days: 3

notification_receipts:
  template_version: 2
  send_login: true
  send_subscribe: true
  send_allotment: true

