# 自动打新系统配置（非敏感项）
# 敏感信息（SendKey、服务器凭据）→ config/secrets.yaml（git 忽略）
# 券商密码 → 永不放这里，只存本机执行端加密存储

project: auto_ipo

# 账户元数据（不含任何密码）；ID 即备注名（可中文，推送消息会带上）
# permissions 勾选才打对应市场；沪深主板新股无需权限，以券商柜台额度为准
# 2026-10-15 已与客户端已登录账户对齐（资金账号见 secrets.yaml）；已登录账户切换不需要密码
# menu_row 仅为历史坐标缓存，运行时按账户名称动态匹配；不需要人工维护
accounts:
- id: 许*鸣
  broker: 中信建投
  account_type: credit
  enabled: true
  permissions:
  - cb
  - cyb
  - kcb
  - bj
  strategy: all
- id: 张*龙
  broker: 平安证券
  account_type: normal
  enabled: true
  permissions: [cb]
  strategy: all
- id: 揭*
  broker: 平安证券
  account_type: normal
  enabled: true
  permissions: [cb]
  strategy: all
- id: 蔡*良
