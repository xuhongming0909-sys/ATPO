# 敏感配置模板 —— 复制为 config/secrets.yaml；禁止提交 git、写入日志或放入推送正文
# Windows DPAPI 密文绑定当前电脑 + 当前 Windows 用户，换机/换用户后必须重新录入
# 新模式 ths_account_switch 不要求完整资金账号；密码密文可选，缺失时依赖客户端已保存密码

serverchan:
  sendkey: ""

server_ssh:
  user: ""
  password: ""

# 当前默认模式：execution.active_mode=ths_account_switch
# 键名必须与 execution.ths_account_switch.accounts[].username 完全一致
ths_account_secrets:
  mx_example_1:
    password_enc: ""

# 仅 execution.active_mode=dual_client 回滚时使用；新模式不读取本段
accounts_secrets:
  账户备注名:
    fund_account: ""
    password_enc: ""
